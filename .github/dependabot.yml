version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The project targets Python 3.12 (pyproject, uv.lock, CI, runtime images): the base image
      # moves only together with requires-python and the lock, never by a lone image bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # legacy/requirements.txt belongs to the retracted legacy code and is not installed by the
      # project (see legacy/README.md). None of these is in pyproject.toml, so ignoring them only
      # silences the legacy file.
      - dependency-name: pmdarima
      - dependency-name: yfinance
      - dependency-name: seaborn
      - dependency-name: tensorflow
      # prefect (<=3.9.4) pins fastapi<0.151, so a fastapi bump makes uv downgrade prefect
      # (3.9.3 -> 3.8.8). Remove this entry once a prefect release lifts the cap.
      - dependency-name: fastapi
        versions: [">=0.151"]
