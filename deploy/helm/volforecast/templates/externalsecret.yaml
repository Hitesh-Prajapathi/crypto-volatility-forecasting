{{- if and .Values.externalSecret.enabled (not .Values.secrets.existingSecret) }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "volforecast.fullname" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "volforecast.secretName" . }}
    creationPolicy: Owner
  data:
    {{- toYaml (required "externalSecret.data is required" .Values.externalSecret.data) | nindent 4 }}
{{- end }}
