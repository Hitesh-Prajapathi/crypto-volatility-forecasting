{{- if .Values.monitoring.enabled }}
{{- $r := .Values.monitoring.prometheusRule }}
{{- /*
  The rule groups are NOT written here: rules/volforecast-rules.yaml is the single source of truth
  (the compose stack mounts the same file). The only transformation is scoping the API HTTP
  selectors to the release namespace. tests/unit/test_alert_rules.py checks that every such
  selector in the file is written with braces (`{...}` or `{}`), which is what the replace below
  keys on (`{}` leaves a `,}` that the last replace removes; the file must not contain `,}`).
*/}}
{{- $rules := .Files.Get "rules/volforecast-rules.yaml" | fromYaml }}
{{- $ns := printf "namespace=%q," .Release.Namespace }}
{{- range $group := $rules.groups }}
{{- range $rule := $group.rules }}
{{- if hasKey $rule "expr" }}
{{- $_ := set $rule "expr" ($rule.expr | replace "http_requests_total{" (printf "http_requests_total{%s" $ns) | replace "http_request_duration_seconds_bucket{" (printf "http_request_duration_seconds_bucket{%s" $ns) | replace ",}" "}") }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "volforecast.fullname" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
    {{- with $r.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
