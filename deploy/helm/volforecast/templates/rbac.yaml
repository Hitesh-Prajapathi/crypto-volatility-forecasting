{{- if .Values.rbac.retrainCanCreateJobs }}
{{- /* Only the retrain CronJob runs as this SA; the API pods mount no token at all. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "volforecast.retrainServiceAccountName" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "volforecast.retrainServiceAccountName" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "volforecast.retrainServiceAccountName" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "volforecast.retrainServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "volforecast.retrainServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
