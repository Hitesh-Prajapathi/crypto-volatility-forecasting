{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /* DEV ONLY: never commit real credentials in values files. Prefer existingSecret / externalSecret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "volforecast.secretName" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
  annotations:
    volforecast/dev-only: "true"
type: Opaque
stringData:
  VOLF_DATABASE_URL: {{ required "secrets.dev.databaseUrl is required when secrets.create=true" .Values.secrets.dev.databaseUrl | quote }}
  AWS_ACCESS_KEY_ID: {{ required "secrets.dev.awsAccessKeyId is required when secrets.create=true" .Values.secrets.dev.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.dev.awsSecretAccessKey is required when secrets.create=true" .Values.secrets.dev.awsSecretAccessKey | quote }}
{{- end }}
