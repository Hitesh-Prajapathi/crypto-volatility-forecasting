{{- if and (eq .Values.dataVolume.type "pvc") (not .Values.dataVolume.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "volforecast.dataClaimName" . }}
  labels:
    {{- include "volforecast.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.dataVolume.accessModes | nindent 4 }}
  {{- with .Values.dataVolume.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dataVolume.size }}
{{- end }}
