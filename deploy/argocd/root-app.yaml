# App-of-apps root. Apply once (deploy/kind/bootstrap.sh does it); Argo CD then manages everything
# under deploy/argocd/apps/ from git.
#
# Forks: replace the repoURL below with your fork's
# URL in this file and in apps/*.yaml (or run bootstrap.sh with REPO_URL=...).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Hitesh-Prajapathi/crypto-volatility-forecasting.git
    targetRevision: HEAD
    path: deploy/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
