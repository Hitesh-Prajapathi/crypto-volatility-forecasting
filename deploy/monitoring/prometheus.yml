# Prometheus config for the compose stack (the cluster uses ServiceMonitor + PrometheusRule instead).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yaml

scrape_configs:
  - job_name: volforecast-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
