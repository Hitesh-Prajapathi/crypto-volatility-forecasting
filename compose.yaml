# Local platform stack. Usage:
#   cp .env.example .env
#   docker compose build api mlflow
#   docker compose up -d                       # whole platform
#   docker compose --profile jobs run --rm jobs   # one batch flow (JOB_FLOW in .env)
#   docker compose down -v
name: volforecast

x-app-env: &app-env
  VOLF_DATA_DIR: /data
  VOLF_LOG_JSON: "true"
  VOLF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  PREFECT_API_URL: http://prefect:4200/api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO Inc. no longer publishes community images to Docker Hub/Quay; Chainguard's
  # rebuild only offers a rolling `latest` tag (pin by digest in production-like setups).
  # Distroless: no shell/curl, so no container healthcheck; minio-init retries instead.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [miniodata:/data]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio: { condition: service_started }
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?}:${MINIO_ROOT_PASSWORD:?}@minio:9000
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/mlflow", "local/reports"]
    # The distroless image has no shell for a wait loop: retry until MinIO accepts connections.
    restart: on-failure:20

  mlflow:
    build:
      context: docker
      dockerfile: mlflow.Dockerfile
    image: volforecast-mlflow:dev
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=*
    ports: ["127.0.0.1:${MLFLOW_PORT:-5000}:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  prefect:
    image: prefecthq/prefect:3.4.19-python3.12
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_HOME: /tmp/prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports: ["127.0.0.1:${PREFECT_PORT:-4200}:4200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${API_IMAGE:-volforecast-api:dev}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # API knobs (docs/api.md). The limit is per client IP and per worker; raise it for k6.
      VOLF_API_RATE_LIMIT_RPS: ${API_RATE_LIMIT_RPS:-20}
      VOLF_API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      # GET /v1/backtest/summary serves this file (404 when ./reports/results.json is absent)
      VOLF_RESULTS_PATH: /reports/results.json
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - data:/data
      - ./reports:/reports:ro
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  jobs:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/jobs.Dockerfile
    image: ${JOBS_IMAGE:-volforecast-jobs:dev}
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    environment: *app-env
    command: ["python", "-m", "volforecast.flows.${JOB_FLOW:-forecast}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: [data:/data]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts:/etc/prometheus/alerts:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
  data:
