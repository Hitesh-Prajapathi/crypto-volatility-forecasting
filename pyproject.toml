[project]
name = "volforecast"
version = "0.1.0"
description = "Walk-forward realized-volatility forecasting and VaR backtesting for crypto assets, with a production MLOps stack."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "arch>=7.0",
    "pandera[pandas]>=0.24",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volforecast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD002", "PT"]
ignore = ["N803", "N806", "RUF002", "RUF003"]  # allow math-style names like X, RV, h

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["volforecast"]
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = ["volforecast.serving.*", "volforecast.flows.*", "volforecast.registry.*", "volforecast.monitoring.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs internet access (deselect with -m 'not network')",
    "slow: slow test",
]
filterwarnings = ["ignore::DeprecationWarning:arch.*"]

[tool.coverage.run]
source = ["volforecast"]
branch = true
